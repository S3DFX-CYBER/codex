name: PoC execpolicy basename approval inheritance

on:
  workflow_dispatch:

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Install dotslash (fetches the pinned zsh-fork used by the core test harness)
        run: |
          curl -sSL https://github.com/facebook/dotslash/releases/download/v0.5.9/dotslash-linux-musl.x86_64.tar.gz | tar xz
          sudo install -m 0755 dotslash /usr/local/bin/dotslash
          dotslash --version

      - name: Run policy-level PoC test (execpolicy crate)
        working-directory: codex-rs
        run: cargo test -p codex-execpolicy --test basename_approval_inheritance -- --nocapture

      - name: Build sandbox helper binary for end-to-end test
        working-directory: codex-rs
        run: cargo build -p codex-shell-escalation --bin codex-execve-wrapper

      - name: Run end-to-end PoC test (core session, real sandbox)
        working-directory: codex-rs
        run: cargo test -p codex-core --test exec_policy_basename_poc -- --nocapture
